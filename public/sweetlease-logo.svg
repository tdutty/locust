<svg width="240" height="48" viewBox="0 0 240 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for square icon background -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Square icon on left -->
  <rect x="0" y="0" width="48" height="48" rx="10" fill="url(#iconBg)"/>
  
  <!-- Key icon inside square -->
  <g transform="translate(18, 16) rotate(90 6 6)">
    <circle cx="6" cy="6" r="5" fill="none" stroke="#FFFFFF" strokeWidth="2"/>
    <circle cx="6" cy="6" r="2" fill="#FFFFFF"/>
    <line x1="11" y1="6" x2="20" y2="6" stroke="#FFFFFF" strokeWidth="2"/>
    <line x1="14" y1="6" x2="14" y2="9" stroke="#FFFFFF" strokeWidth="2"/>
    <line x1="17" y1="6" x2="17" y2="11" stroke="#FFFFFF" strokeWidth="2"/>
    <line x1="20" y1="6" x2="20" y2="9" stroke="#FFFFFF" strokeWidth="2"/>
  </g>
  
  <!-- SWEETLEASE text - larger and vertically centered with icon -->
  <text x="60" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#000000" letter-spacing="-0.02em">SWEETLEASE</text>
</svg>